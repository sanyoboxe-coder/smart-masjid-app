<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Masjid TV</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #020617; }
    body {
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 15px 25px;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      transition: background 0.4s ease-in-out;
    }

    body.theme-navy { background: radial-gradient(circle at center, #1e3a8a 0%, #0a1128 70%, #020617 100%); }
    body.theme-emerald { background: radial-gradient(circle at center, #064e3b 0%, #022c22 70%, #01140e 100%); }
    body.theme-charcoal { background: radial-gradient(circle at center, #1e293b 0%, #0f172a 70%, #020617 100%); }

    /* النوافذ العائمة */
    .setup-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(2, 6, 23, 0.98); z-index: 100000;
      display: none; justify-content: center; align-items: center; padding: 20px;
    }
    .setup-box {
      background: #0f172a; border: 2px solid #38bdf8; border-radius: 20px;
      padding: 25px 35px; width: 100%; max-width: 620px; text-align: right;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
      max-height: 90vh; overflow-y: auto;
    }
    .setup-title { font-size: 1.5rem; font-weight: 900; color: #38bdf8; text-align: center; margin-bottom: 15px; }
    .setup-label { font-size: 0.95rem; color: #94a3b8; margin-top: 10px; margin-bottom: 5px; display: block; font-weight: 700; }
    .setup-input, .setup-select {
      width: 100%; padding: 11px; border-radius: 10px; border: 1px solid #334155;
      background: #1e293b; color: #fff; font-size: 1rem; outline: none;
    }
    .setup-row { display: flex; gap: 10px; margin-top: 5px; }
    .btn-act {
      width: 100%; padding: 12px; border: none; border-radius: 10px; font-size: 1.05rem;
      font-weight: 900; cursor: pointer; margin-top: 10px; transition: 0.2s;
    }
    .btn-save { background: #16a34a; color: #fff; margin-top: 15px; }
    .btn-gps { background: #0284c7; color: #fff; }
    .btn-file { background: #475569; color: #fff; }
    .btn-del { background: #b91c1c; color: #fff; padding: 6px 12px; font-size: 0.85rem; border-radius: 6px; border: none; cursor: pointer; }

    /* الشريط العلوي */
    .top-bar { 
      background: rgba(15, 23, 42, 0.85); padding: 8px 25px; border-radius: 14px;
      display: flex; justify-content: space-between; align-items: center; 
      font-size: 1.25rem; font-weight: 700; border: 1px solid rgba(255,255,255,0.1);
    }
    .top-tools { display: flex; align-items: center; gap: 12px; }
    .btn-qr-pair {
      background: #0284c7; color: #fff; border: none; padding: 6px 14px; border-radius: 8px;
      font-size: 0.95rem; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 6px;
    }
    .btn-qr-pair.locked { background: #334155; color: #94a3b8; }
    .settings-trigger { cursor: pointer; opacity: 0.8; font-size: 1.3rem; }

    /* القسم الأوسط */
    .center-section { display: flex; align-items: center; justify-content: space-between; width: 100%; padding: 0 10px; }
    .side-box { 
      text-align: center; min-width: 155px; background: rgba(15, 23, 42, 0.75); 
      padding: 10px 20px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.08);
    }
    .side-title { font-size: 1.3rem; font-weight: 800; color: #94a3b8; }
    .side-time { font-size: 2.6rem; font-weight: 900; font-family: monospace; color: #f8fafc; }

    .clock-card { 
      background: linear-gradient(135deg, rgba(30, 58, 138, 0.9), rgba(15, 23, 42, 0.95)); 
      border-radius: 24px; padding: 12px 45px; text-align: center; min-width: 520px; 
      box-shadow: 0 15px 35px rgba(0,0,0,0.6); border: 2px solid rgba(56, 189, 248, 0.3);
    }
    .main-clock { font-size: 4.8rem; font-weight: 900; font-family: monospace; line-height: 1; letter-spacing: 2px; }
    .hijri-date { font-size: 1.45rem; font-weight: 900; color: #facc15; margin-top: 6px; }
    .greg-date { font-size: 1.15rem; font-weight: 700; color: #93c5fd; margin-top: 2px; direction: ltr; }

    .middle-info-bar { display: flex; align-items: center; justify-content: space-between; gap: 15px; padding: 0 10px; }
    .dhikr-box { 
      flex: 1.8; background: rgba(15, 23, 42, 0.8); border-radius: 18px; 
      padding: 10px 25px; font-size: 1.3rem; text-align: center; white-space: nowrap; 
      overflow: hidden; text-overflow: ellipsis; border: 1px solid rgba(255,255,255,0.08);
    }
    .countdown-bar { 
      flex: 1.2; background: rgba(15, 23, 42, 0.85); border-radius: 18px; 
      padding: 10px 25px; display: flex; align-items: center; justify-content: center; 
      gap: 10px; font-size: 1.35rem; font-weight: 800; border: 1px solid rgba(255,255,255,0.08);
    }
    .countdown-bar .count-val { font-family: monospace; font-size: 1.8rem; color: #38bdf8; direction: ltr; }
    .countdown-bar.green-mode { border-color: #22c55e; }
    .countdown-bar.green-mode .count-val { color: #22c55e; text-shadow: 0 0 12px #22c55e; }

    /* بطاقات الصلوات الخمس */
    .prayers-row { display: flex; justify-content: space-between; gap: 12px; padding: 0 10px; }
    .p-card { 
      flex: 1; background: rgba(15, 23, 42, 0.75); border-radius: 18px; 
      padding: 10px 6px; text-align: center; border: 2px solid rgba(255,255,255,0.12);
    }
    .p-card.active-p { 
      background: linear-gradient(180deg, rgba(30, 64, 175, 0.95), rgba(15, 23, 42, 0.95)); 
      border-color: #38bdf8; transform: translateY(-4px); box-shadow: 0 8px 25px rgba(56, 189, 248, 0.3);
    }
    .p-name { font-size: 1.5rem; font-weight: 900; }
    .p-subname { font-size: 0.85rem; font-weight: 700; color: #94a3b8; text-transform: uppercase; margin-bottom: 2px; }
    .p-time { font-size: 2.4rem; font-weight: 900; font-family: monospace; }
    .p-iqama { font-size: 1.25rem; font-weight: 800; color: #93c5fd; direction: ltr; }

    /* الشريط الإخباري بالأسفل */
    .bottom-bar { 
      background: rgba(15, 23, 42, 0.85); padding: 6px 20px; border-radius: 12px; 
      overflow: hidden; white-space: nowrap; display: flex; align-items: center; height: 44px;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .marquee-content {
      display: inline-block; padding-left: 100%; animation: marquee 30s linear infinite;
      font-size: 1.25rem; font-weight: 800; color: #facc15;
    }
    @keyframes marquee { 0% { transform: translate3d(0,0,0); } 100% { transform: translate3d(-100%,0,0); } }

    /* شاشة الإقامة وملء الشاشة */
    .fullscreen-modal {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(2, 6, 23, 0.97); z-index: 99999; display: none;
      flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 30px;
    }
    .modal-head { font-size: 3.4rem; font-weight: 900; color: #facc15; margin-bottom: 10px; }
    .modal-head-sub { font-size: 1.8rem; font-weight: 700; color: #e2e8f0; margin-bottom: 20px; text-transform: uppercase; }
    .modal-timer { font-size: 9.5rem; font-weight: 900; font-family: monospace; color: #facc15; text-shadow: 0 0 30px rgba(250,204,21,0.6); direction: ltr; }
    .modal-body { font-size: 2.4rem; font-weight: 800; color: #ffffff; line-height: 1.5; max-width: 90%; }
    .modal-body-sub { font-size: 1.7rem; font-weight: 700; color: #cbd5e1; margin-top: 10px; }
    .modal-sub { font-size: 2rem; font-weight: 900; color: #ef4444; margin-top: 25px; background: rgba(239,68,68,0.15); padding: 8px 25px; border-radius: 14px; border: 1px solid #ef4444; }
    .modal-sub-sub { font-size: 1.4rem; font-weight: 700; color: #fca5a5; margin-top: 8px; }
  </style>
</head>
<body class="theme-navy">

  <!-- نافذة الباركود -->
  <div class="setup-overlay" id="qrPairModal">
    <div class="setup-box" style="text-align: center; max-width: 480px;">
      <div class="setup-title" id="qrTitle">📱 ربط هاتف الإمام الحصري</div>
      <p id="qrDesc" style="color: #94a3b8; font-size: 1rem; margin-bottom: 15px;">
        امسح هذا الرمز بكاميرا هاتفك لتصبح المسؤول المعتمد الوحيد لهذا المسجد:
      </p>
      <div id="qrContainer" style="background: #fff; padding: 15px; border-radius: 16px; display: inline-block; margin-bottom: 15px;">
        <img id="qrImg" src="" alt="QR Pairing" style="width: 220px; height: 220px; display: block;">
      </div>
      <div id="pairStatusInfo" style="font-size: 0.95rem; color: #38bdf8; margin-bottom: 15px;">
        🔐 الرمز مخصص لهذا المسجد فقط وسيتم قفل النظام فور اكتمال الربط
      </div>
      <button type="button" class="btn-act btn-gps" onclick="document.getElementById('qrPairModal').style.display='none'">إغلاق</button>
    </div>
  </div>

  <!-- نافذة التخصيص الكاملة -->
  <div class="setup-overlay" id="setupModal">
    <div class="setup-box">
      <div class="setup-title">⚙️ تخصيص شاشة المسجد</div>
      
      <div class="setup-row">
        <div style="flex:1;">
          <label class="setup-label">الهيئة الإسلامية المعتمدة لحساب المواقيت:</label>
          <select id="cfgMethod" class="setup-select">
            <option value="21" selected>المغرب - وزارة الأوقاف والشؤون الإسلامية (Salat First)</option>
            <option value="4">السعودية والخليج - جامعة أم القرى (مكة المكرمة)</option>
            <option value="5">مصر والدول العربية - الهيئة العامة المصرية للمساحة</option>
            <option value="3">عالمي / أوروبا وأمريكا - رابطة العالم الإسلامي (MWL)</option>
            <option value="13">تركيا - رئاسة الشؤون الدينية (Diyanet)</option>
          </select>
        </div>
      </div>

      <div class="setup-row">
        <div style="flex:1;">
          <label class="setup-label">لغة العرض والتنبيه:</label>
          <select id="cfgLang" class="setup-select" onchange="changeLanguage(this.value)">
            <option value="ar">العربية (Arabic)</option>
            <option value="fr" selected>Français (الفرنسية)</option>
            <option value="en">English (الإنجليزية)</option>
            <option value="es">Español (الإسبانية)</option>
            <option value="tr">Türkçe (التركية)</option>
            <option value="de">Deutsch (الألمانية)</option>
          </select>
        </div>
        <div style="flex:1;">
          <label class="setup-label">نطاق التوقيت (GMT):</label>
          <select id="cfgTimezone" class="setup-select">
            <option value="1" selected>GMT +01:00 (المغرب / أوروبا الوسطى)</option>
            <option value="0">GMT +00:00 (توقيت رمضان بالمغرب / جرينتش)</option>
            <option value="auto">تلقائي (حسب نظام الجهاز)</option>
            <option value="2">GMT +02:00 (مصر / ليبيا)</option>
            <option value="3">GMT +03:00 (مكة المكرمة / تركيا)</option>
          </select>
        </div>
      </div>

      <!-- خانات التعديل اليدوي بالدقائق لم
